<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golazo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golazo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071126">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#071126;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  /* ----- Splash ----- */
  #splash{position:fixed;inset:0;z-index:10;background:#071126;display:flex;flex-direction:column;
          align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s}
  #splash.oculto{opacity:0;pointer-events:none}
  #splash .franja{position:absolute;width:14px;height:70vh;background:#00e5c1;opacity:.9;transform:rotate(35deg);border-radius:2px}
  #splash .f1{top:-18vh;left:9vw}
  #splash .f2{top:-22vh;left:calc(9vw + 34px);width:6px;opacity:.5}
  #splash .f3{bottom:-18vh;right:9vw}
  #splash .f4{bottom:-22vh;right:calc(9vw + 34px);width:6px;opacity:.5}
  #splash .logo{width:min(78vw,360px);opacity:0;transform:scale(.92);animation:entra .8s ease-out .15s forwards}
  #splash .frase{margin-top:22px;color:#94a3b8;font-size:11px;letter-spacing:3px;text-transform:uppercase;
                 text-align:center;opacity:0;animation:entra .8s ease-out .5s forwards}
  #splash .barra{margin-top:34px;width:120px;height:3px;border-radius:3px;background:#13223f;overflow:hidden;
                 opacity:0;animation:entra .6s ease-out .7s forwards}
  #splash .barra i{display:block;height:100%;width:40%;background:#00e5c1;border-radius:3px;animation:carga 1.1s ease-in-out infinite}
  @keyframes entra{to{opacity:1;transform:none}}
  @keyframes carga{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  /* ----- Encabezado y app ----- */
  header{position:fixed;top:0;left:0;right:0;height:64px;padding-top:env(safe-area-inset-top);
         background:#071126;display:flex;align-items:center;justify-content:center}
  header img{height:44px}
  iframe{position:fixed;left:0;bottom:0;width:100%;border:0;background:#071126;
         top:calc(64px + env(safe-area-inset-top));height:calc(100% - 64px - env(safe-area-inset-top))}
</style>
</head>
<body>
  <div id="splash">
    <span class="franja f1"></span><span class="franja f2"></span>
    <span class="franja f3"></span><span class="franja f4"></span>
    <img class="logo" src="logo-horizontal.png" alt="Golazo">
    <div class="frase">Tu pasión &nbsp;•&nbsp; Tus pronósticos &nbsp;•&nbsp; Más puntos</div>
    <div class="barra"><i></i></div>
  </div>
  <header><img src="logo-horizontal.png" alt="Golazo"></header>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbw4uERq88tZs3ZzYNcieNAKwR1BChyYuMte_paaod9Aox51OOpB_Qg4l5UVrRyEcOaA/exec"></iframe>
<script>
  const s=document.getElementById('splash');let cargo=false,tiempo=false;
  const cerrar=()=>{if(cargo&&tiempo)s.classList.add('oculto')};
  setTimeout(()=>{tiempo=true;cerrar()},1800);
  document.getElementById('app').addEventListener('load',()=>{cargo=true;cerrar()});
  setTimeout(()=>s.classList.add('oculto'),8000);
</script>
</body>
</html>
